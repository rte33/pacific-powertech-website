meta:
  title: "Electrical Load Calculator & Substation Sizing Tool | Pacific Powertech Ltd."
  description: "Calculate connected load in kW, monthly consumption in kWh, and determine required transformer kVA, LT switchgear, and PFI capacitor ratings for DESCO, DPDC & BPDB compliance."

header:
  badge: "DESCO & BPDB Sanction Compliance · Substation Engineering"
  title: "Electrical Load Calculator & Substation Sizing Tool"
  subtitle: "Interactive electrical load schedule and substation equipment sizing calculator. Compute connected load (kW), monthly energy consumption (kWh), and determine required Distribution Transformer capacity (kVA), Main LT Switchgear (Amperes), and PFI Capacitor Bank rating (kVAR) under Bangladesh National Building Code (BNBC) standards."

complianceNotice:
  title: "Bangladesh Electricity Sanction & Substation Requirement"
  thresholdKw: 50
  textLt: "Loads up to 50 kW are typically eligible for direct Low Voltage (415V/230V) utility sanction from DESCO / DPDC / BREB / BPDB."
  textHt: "Loads exceeding 50 kW (or 75 kW depending on utility zone) mandate a customer-owned 11 kV / 0.415 kV indoor substation comprising HT Switchgear (VCB/LBS), Distribution Transformer, LT Switchgear, and PFI plant under Bangladesh electricity rules."

