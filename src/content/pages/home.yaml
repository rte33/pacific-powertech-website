featuredSolutions:
  sectionTitle: "Core Engineering Solutions"
  sectionSubtitle: "Complete electrical power infrastructure and automation systems engineered to IEC, BS, ANSI, and VDE standards."
  items:
    - title: "Distribution Transformers"
      slug: "transformers"
      image: "distribution-transformer-conservator-type.jpeg"
      summary: "High-efficiency oil-immersed distribution transformers from 100 kVA to 3000 kVA, manufactured with high-permeability CRGO steel and pure electrolytic copper windings."
      highlights:
        - "100 kVA to 3000 kVA capacities"
        - "CRGO silicon steel imported from France & Japan"
        - "ONAN and ONAF cooling options"
        - "Routine & type tested in BSTI-approved laboratory"
      url: "/products/transformers"

    - title: "LT Switchgear Panels"
      slug: "lt-switchgear"
      image: "lt-switchgear-acb-panel-lineup.jpeg"
      summary: "Robust low-voltage switchgear engineered as the heart of your distribution system, featuring Air Circuit Breakers (ACB) up to 6300A and anti-corrosive 7-tank powder coating."
      highlights:
        - "ACB protection from 800A to 6300A"
        - "Rated service voltage up to 690V / 1000V insulation"
        - "7-tank hot phosphate anti-corrosive coating"
        - "Microprocessor-based true RMS current sensing"
      url: "/products/lt-switchgear"

    - title: "Power Factor Improvement (PFI)"
      slug: "pfi-systems"
      image: "pfi-plant-apfc-control-panel.jpeg"
      summary: "Centralized Automatic Power Factor Correction (APFC) plants with intelligent microprocessor relays to eliminate utility surcharges, reduce energy losses, and optimize transformer capacity."
      highlights:
        - "High inrush withstand capacitors (100 IR)"
        - "Microprocessor-controlled multistage switching"
        - "Detuned harmonic filter reactors"
        - "Group overcurrent & thermal fan protection"
      url: "/products/pfi-systems"

    - title: "HT Switchgear (11 kV)"
      slug: "ht-switchgear"
      image: "ht-switchgear-vcb-cubicles-lineup.jpeg"
      summary: "Metal-clad extensible 11 kV vacuum switchgear equipped with authentic ABB VD4 vacuum circuit breakers, load break switches (LBS), and ceramic interrupters for high operational safety."
      highlights:
        - "ABB VD4 vacuum circuit breaker integration"
        - "Extensible, vermin-proof modular construction"
        - "LBS mechanism for 630A with HRC fuse protection"
        - "Interlocked mechanical safety with withdrawable truck"
      url: "/products/ht-switchgear"

    - title: "Industrial Automation & SCADA"
      slug: "industrial-automation"
      image: "control-panel-contactors-breakers-interior.jpeg"
      summary: "Turnkey industrial automation, PLC-HMI-SCADA systems, Motor Control Centers (MCC), and VFD panels engineered with premier hardware from Siemens, Mitsubishi, and Omron."
      highlights:
        - "Siemens, Mitsubishi, Yaskawa & Omron platforms"
        - "Real-time SCADA and remote machine monitoring"
        - "Custom MCC, VFD, RTU, and ATS panel assembly"
        - "Downtime reduction and automated production tracking"
      url: "/products/industrial-automation"

    - title: "Engineering Services & AMC"
      slug: "services"
      image: "electrical-panel-testing-multimeter.jpeg"
      summary: "Comprehensive power engineering consultancy, Annual Maintenance Contracts (AMC), utility load sanctions (DESCO, DPDC, BPDB, REB), and precision instrument calibration."
      highlights:
        - "Official utility load sanction processing"
        - "Field installation, cabling & containment systems"
        - "Testing & commissioning with calibrated instruments"
        - "Preventive & emergency Annual Maintenance Contracts"
      url: "/services"

