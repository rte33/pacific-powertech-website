benefits:
  - number: "01"
    title: "Substantial Productivity Gains"
    description: "Replaces repetitive manual control cycles with high-speed deterministic logic, reducing batch cycle times."
  - number: "02"
    title: "Centralized Remote Monitoring"
    description: "Enables operators and management to monitor line statuses, temperatures, speeds, and faults from control rooms or mobile dashboards."
  - number: "03"
    title: "Historical Event & Machine Logging"
    description: "Captures minute-by-minute process trends, alarms, and production counts into secure SQL/remote databases for audit compliance."
  - number: "04"
    title: "Rapid Commissioning"
    description: "Panels undergo full hardware simulation in our works, slashing on-site startup and integration delays."
  - number: "05"
    title: "Minimized Unplanned Downtime"
    description: "Detailed diagnostic alarm annunciations pinpoint sensor, motor, or valve failures instantly."
  - number: "06"
    title: "Accelerated Maintenance"
    description: "Structured ladder logic and tagged ferruled terminal wiring simplify routine maintenance and repairs."
  - number: "07"
    title: "Operational Cost Reduction"
    description: "Eliminates operator error, optimizes motor power consumption via VFD speed regulation, and prevents equipment burnouts."
  - number: "08"
    title: "Precision Quality Control"
    description: "Maintains exact dosing, tensioning, heating, and conveyor speeds, eliminating human variation."
  - number: "09"
    title: "Overall Energy Efficiency"
    description: "Coordinates motor starts to eliminate peak electrical demand spikes and optimizes load-shedding sequences."
  - number: "10"
    title: "Modernized Manufacturing"
    description: "Prepares legacy Bangladesh factories for Industry 4.0 data exchange and automated reporting."

panelTypes:
  - name: "PLC-HMI-SCADA Control Panels"
    description: "Central industrial controller cabinets equipped with high-performance CPUs, isolated digital/analog I/O, touchscreen HMIs, and uninterruptible power supplies."
  - name: "Motor Control Centers (LV MCC)"
    description: "Compartmentalized motor starter panels featuring withdrawable or fixed starter buckets, soft starters, and intelligent electronic motor protection relays."
  - name: "Variable Frequency Drive (VFD) Panels"
    description: "Enclosed drive cubicles with integrated line reactors, harmonic filters, and forced cooling fans for smooth motor speed regulation in pumps, fans, and compressors."
  - name: "SERVO Drive Motion Control Panels"
    description: "High-precision multi-axis motion control cabinets for packaging machines, CNC feeders, and specialized textile positioning."
  - name: "Remote Terminal Unit (RTU) & Telemetry Panels"
    description: "Substation and field telemetry stations for remote utility monitoring and wireless SCADA backhaul."
  - name: "Automatic Transfer Switches (ATS)"
    description: "High-reliability dual-power generator/mains changeover panels with automatic phase failure detection and engine start sequencing."
  - name: "DOL & Star-Delta Starters"
    description: "Standard robust electro-mechanical starter boxes with thermal overload and single-phase prevention relays."

