meta:
  title: "Distribution Transformers (100–3000 kVA) | Pacific Powertech Ltd."
  description: "High-efficiency oil-immersed 11/.415kV distribution transformers engineered in Bangladesh with imported CRGO silicon steel, electrolytic copper windings, and BSTI/BUET certified testing."

product:
  name: "Distribution Transformers"
  category: "Substation Equipment"
  shortDescription: "Heavy-duty oil-immersed distribution transformers engineered for high electrical efficiency, minimum operational losses, and exceptional lifespan under tropical operating conditions."
  primaryImage: "distribution-transformer-conservator-type.jpeg"
  gallery:
    - "hermetically-sealed-distribution-transformer.jpeg"
    - "hermetically-sealed-distribution-transformer-3d.jpeg"
    - "pole-mounted-distribution-transformer.jpeg"
    - "transformer-bushings-with-arcing-horns.jpeg"
    - "transformer-substation-bushing-connections.jpeg"

parameters:
  primaryVoltage: "11 kV"
  secondaryVoltage: "415 / 220 V"
  frequency: "50 Hz"
  phase: "3 Phase"
  coolingSystems: "ONAN (Oil Natural Air Natural) / ONAF (Oil Natural Air Forced)"
  insulationClass: "Class A"
  designStandards: "IEC 76, BS 171, ANSI C57.12, VDE 0532"

features:
  - title: "CRGO Silicon Steel Core"
    description: "Constructed from high-permeability cold-rolled grain-oriented (CRGO) silicon steel sheet imported from France and Japan. Stepped core assembly minimizes no-load losses, excitation currents, and acoustic humming."
  - title: "Electrolytic Copper Windings"
    description: "Manufactured using high-conductivity electrolytic copper with pinhole-free super enameled wire for HV windings and pure cellulose paper insulated copper strips for LV windings."
  - title: "Seam-Welded Radiators & Heavy Tank"
    description: "Fabricated from high-grade sheet steel with a rigid bottom and oil drainage outlet. Radiators are formed in-house with seam, MIG, and TIG welding, chemically degreased, and pressure tested for zero leakage."
  - title: "Corrosion-Resistant Multi-Coat Finish"
    description: "Tanks are sandblasted to international standards before applying a zinc-etching primer and two heavy protective coats, achieving a minimum thickness of 140 microns."
  - title: "Precision Tap Changer"
    description: "Fitted with off-circuit tap changers from Come (Italy) built with high-grade igneous insulating board or synthetic resin mould, allowing precise voltage adjustment."
  - title: "Accredited In-House Routine Testing"
    description: "Every unit is tested in our BSTI and BUET approved laboratory for insulation resistance, turns ratio, induced overvoltage, load and no-load losses, and oil breakdown voltage."

accessories:
  - name: "Buchholz Relay"
    description: "Installed between tank and conservator to detect internal electrical faults and gas build-up, with micro-switch contacts rated at 5A 250VAC."
  - name: "DGPT2 Hermetic Relay"
    description: "Ideal for hermetically sealed designs to monitor gas discharge, temperature, and internal pressure surges in transformers >500 kVA."
  - name: "Pressure Relief Valve"
    description: "Spring-loaded valve that opens briefly during internal pressure surges and automatically reseals to protect tank integrity."
  - name: "Silica Gel Breather"
    description: "Unidirectional dehydrating breather with liquid silicon oil seal preventing moisture ingress into the insulating oil."
  - name: "Magnetic Oil Level Indicator"
    description: "Dual permanent magnet transmission displaying oil levels in the conservator without risk of oil leaks."
  - name: "Dial Thermometer with Contacts"
    description: "Max-pointer temperature gauge scaled up to 120°C with adjustable alarm and trip electrical contacts."

testsConducted:
  routineTests:
    - "Insulation Resistance Test"
    - "Induced Over-Voltage Test"
    - "Separate Source Voltage Withstand Test (HV & LV)"
    - "Turns Ratio, Polarity & Phase Relationship Test"
    - "HV & LV Winding Resistance Test"
    - "No-Load Current & No-Load Loss Measurement"
    - "Full-Load Current & Full-Load Loss Test"
    - "Load Loss at Rated Current & Frequency"
    - "Percentage Impedance Verification"
    - "Core Insulation Test"
    - "Insulating Oil Dielectric Strength & Tan-Delta Test"
    - "Tap Changer Functional Test"
  typeTests:
    - "Temperature Rise Test"
    - "Short-Circuit & Overload Withstand Test"
    - "Acoustic Noise Level Test"
    - "Oil Leakage Pressure Test"

