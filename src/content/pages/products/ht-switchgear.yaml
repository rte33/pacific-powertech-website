meta:
  title: "11 kV HT Switchgear & ABB VD4 VCB Panels | Pacific Powertech Ltd."
  description: "11 kV indoor metal-clad vacuum switchgear with authentic ABB VD4 circuit breakers, Load Break Switches (LBS), lightning arresters, and dropout fuses in Bangladesh."

product:
  name: "HT Switchgear Panels (11 kV)"
  category: "Medium Voltage Distribution"
  shortDescription: "11 kV metal-clad modular switchgear cubicles featuring authentic ABB VD4 vacuum circuit breakers, high-capacity Load Break Switches (LBS), and advanced safety interlocks."
  primaryImage: "ht-switchgear-vcb-cubicles-lineup.jpeg"
  gallery:
