meta:
  title: "Engineering Services & Industry Expertise | Pacific Powertech Ltd."
  description: "Professional power engineering services in Bangladesh: Substation AMC, DESCO/DPDC load sanctions, field installation, SCADA design, and sector-specific industrial automation."

header:
  badge: "Engineering & Lifecycle Solutions"
  title: "Comprehensive Engineering Services & Industry Expertise"
  subtitle: "From utility load sanction approvals to turnkey panel assembly and preventive AMC contracts, our engineers support every stage of your power infrastructure lifecycle."

servicesList:
  - title: "PLC Programming & SCADA Design"
    icon: "code"
    description: "Tailored industrial software development for Siemens, Mitsubishi, and Omron controllers, complemented by high-visibility SCADA mimic displays and real-time alarming."
  - title: "Electrical Load Sanction Assistance"
    icon: "file-text"
    description: "End-to-end technical documentation and official coordination for factory load sanctions with utilities including DESCO, DPDC, BPDB, and BREB."
  - title: "Field Instrumentation & Cabling Containment"
    icon: "cable"
    description: "Turnkey plant floor cable tray containment, conduit routing, sensor termination, and shielding to eliminate electromagnetic interference."
  - title: "System Commissioning & Startup"
    icon: "play-circle"
    description: "Structured on-site loop checking, cold and hot commissioning, relay calibration, and delivery of comprehensive as-built schematics."
  - title: "Annual Maintenance Contracts (AMC)"
    icon: "shield"
    description: "Scheduled preventive maintenance programs, infrared thermal scanning, transformer oil breakdown voltage testing, and 24/7 priority emergency response."
  - title: "Control Panel Design & Custom Assembly"
    icon: "cpu"
    description: "In-house engineering of custom distribution and starter cubicles adhering strictly to BNBC, IEC, and local utility regulations."

