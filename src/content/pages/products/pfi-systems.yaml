parameters:
  systemVoltage: "415 V (3 Phase, 4 Wire)"
  frequency: "50 Hz"
  targetPowerFactor: "0.98 to 0.99 Lagging"
  switchingSteps: "6, 8, 12, or 16 Steps (Rotational Cyclic)"
  inrushCurrentCapacity: "Up to 100 × Rated Current (100 IR)"
  capacitorTechnology: "Self-healing metallized polypropylene with overpressure disconnector"

engineeringPrinciples:
  title: "Why Power Factor Correction is Essential"
  formula: "PF = P (kW) / S (kVA)"
  explanation: "Reactive current circulating between the power utility and industrial inductive loads (motors, welders, transformers) converts usable energy into wasteful heat, dropping line voltage and forcing utilities to impose punitive surcharges. PPTL PFI plants supply local capacitive reactive power, restoring the power factor close to unity (0.98–0.99), releasing transformer capacity, and slashing utility bills."

systemComponents:
  - name: "Microprocessor-Based PFC Controller"
    description: "Continuously samples voltage and current vectors via CTs to calculate real-time reactive demand. Intelligently rotates capacitor stages to equalize operating hours and prevent localized wear."
  - name: "Heavy-Duty Power Capacitors"
    description: "Premium low-loss dry-type capacitors capable of withstanding inrush currents up to 100 times nominal current (100 IR), featuring self-healing dielectric and internal overpressure safety disconnectors."
  - name: "Specialized Capacitor Contactors"
    description: "Equipped with pre-insertion damping resistors to suppress destructive inrush transients during energization, dramatically extending capacitor contact life."
  - name: "Detuned Harmonic Filter Reactors (Optional)"
    description: "Iron-core series reactors (7%, 14%) preventing electrical resonance and shielding capacitors from high harmonic distortion created by VFDs and nonlinear industrial loads."
  - name: "HRC Fuse Protection & Isolation"
    description: "Fitted with high-breaking-capacity (HRC) fuses rated at 1.6 to 1.8 times nominal capacitor current for rapid isolation of individual stages under short-circuit conditions."
  - name: "Forced Ventilation & Thermal Interlocks"
    description: "Thermostatically controlled louvers and exhaust fans ensuring operating ambient temperatures stay within optimal parameters."

features:
  - title: "Automatic Multi-Stage Switching"
    description: "Configurable in 6 to 16 automatic steps with selectable switching delay times, avoiding unnecessary hunting under fluctuating loads."
  - title: "Dynamic Real-Time Monitoring"
    description: "Front-panel LCD displays active power, reactive power, line voltage, active current, capacitor current, power factor, and harmonic distortion (THD-V / THD-I)."
  - title: "Modular Extensible Design"
    description: "Built within standard cubicles allowing plug-and-play capacity expansion as facility manufacturing loads increase."
  - title: "Comprehensive Safety Interlocks"
    description: "Includes discharge resistor networks reducing terminal voltage to <50V within 60 seconds of disconnection, plus door safety interlocks."

