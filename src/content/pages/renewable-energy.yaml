faqs:
  - question: "How does Net Metering work for industrial consumers in Bangladesh?"
    answer: "Under SREDA Net Metering guidelines, industrial consumers can install solar PV systems up to 70% of their sanctioned load (or up to 3 MW). Solar energy generated during daylight hours is consumed on-site first. Any surplus generation is automatically exported to the national utility grid (DESCO, DPDC, BREB, etc.) through a bi-directional meter and credited against your monthly electricity billing."
  - question: "What is the typical financial payback period for an industrial solar PV system?"
    answer: "Given commercial and industrial electricity tariff rates in Bangladesh, most industrial rooftop solar installations achieve full capital payback within 3.5 to 4.5 years. With module performance warranties extending to 25 years, the remaining 20+ years deliver virtually free electricity."
  - question: "Will the solar PV system function during grid power cuts or load shedding?"
    answer: "Standard on-grid inverters shut down during grid outages for safety (anti-islanding protection). However, Pacific Powertech engineers hybrid solar-diesel synchronization systems that enable the solar PV array to safely feed power alongside your backup diesel generators, cutting daytime diesel fuel expenditure by 40% to 60% without backfeeding into generators."
  - question: "What rooftop structural considerations are necessary before installation?"
    answer: "Modern solar panels with aluminum mounting structures add approximately 12 to 15 kg per square meter of dead load. Before any installation, Pacific Powertech's structural engineers inspect roof trusses, purlins, and sheet gauge to guarantee compliance with the Bangladesh National Building Code (BNBC) and high wind load tolerances."

